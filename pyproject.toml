[project]
name = "fleet-copilot"
version = "1.0.0"
description = "LLM copilot that answers natural-language questions over fleet telematics data (text-to-SQL + RAG)"
authors = [{ name = "Vineetha Susan Alexander" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
