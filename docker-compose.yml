services:
  app:
    build: .
    ports: ["8501:8501"]
    env_file: [.env]
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: [.env]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
